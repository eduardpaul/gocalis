global_num_threads: 4
# Transport hardening for the HTTP / WebSocket control plane.
# A token protects control requests and transcript/recording event streams.
security:
  # Shared bearer token required on control endpoints (/api/execute, /api/ask,
  # /ask, /api/reload-speakers) and both event WebSockets. Empty = auth
  # disabled (any LAN client can drive the device). Sent via
  # "Authorization: Bearer <token>", "X-Auth-Token", or "?token=".
  auth_token: ""
  # Browser Origins allowed to open WebSockets. "*" allows any; empty list allows
  # only localhost and same-origin requests. Non-browser clients (no Origin
  # header) are always allowed.
  allowed_origins: []
models:
  vad:
    silero_onnx_path: "./models/silero_vad.onnx"
    threshold: 0.5
    min_silence_duration_ms: 700
  asr:
    engine: "moonshine"
    language: "es"
    encoder: "./models/sherpa-onnx-moonshine-base-es-quantized-2026-02-27/encoder_model.ort"
    decoder: "./models/sherpa-onnx-moonshine-base-es-quantized-2026-02-27/decoder_model_merged.ort"
    tokens: "./models/sherpa-onnx-moonshine-base-es-quantized-2026-02-27/tokens.txt"
  speaker_id:
    model: "./models/wespeaker_en_voxceleb_CAM++.onnx"
    embeddings_dir: "./models/known_speakers/"
    min_audio_duration_seconds: 2
    confidence_threshold: 0.55
    challenge_failed_prompt: "Acceso denegado."
    challenge_init_prompt: "Por favor, repita"
    challenge_prompts:
      - "Mi voz es mi pasaporte."
      - "Confirmo mi identidad mediante el timbre acústico de mi voz."
      - "Sistema Vocalis, autoriza el acceso a mi perfil personal."
      - "Verificación biométrica en curso para el control principal."
      - "Esta es mi clave vocal de seguridad para hoy."
      - "Reconoce mis patrones de voz y ejecuta el comando."
  tts:
    engine: "supertonic"
    model_dir: "./models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11"
    cache:
      enabled: true
      dir: "./models/tts_cache"
      pre_generate:
        - "Sí, ¿qué desea?"
        - "Disculpe, no le he oído. ¿Quién es?"
        - "La persona de la puerta no dice quién es."
        - "Espere por favor"
        - "Hay alguien en la puerta!"
        - "Un momento, por favor"
        - "¿Qué desea?"
        - "¿Cómo puedo ayudar?"
        - "Sí, mi señor"
        - "Acceso denegado."
        - "Por favor, repita"
        - "Mi voz es mi pasaporte."
        - "Confirmo mi identidad mediante el timbre acústico de mi voz."
        - "Sistema Vocalis, autoriza el acceso a mi perfil personal."
        - "Verificación biométrica en curso para el control principal."
        - "Esta es mi clave vocal de seguridad para hoy."
        - "Reconoce mis patrones de voz y ejecuta el comando."

# Intercom calls: conferences that nodes and intercom pages (/intercom) join
# and leave. While a node is in a call it plays only the call: TTS/ask/play
# requests for it fail with "node is in an intercom call" and an ask in progress
# is ended.
# intercom:
#   # How long a call lasts after the last join when the request does not say.
#   default_timeout_seconds: 60
#   echo_cancellation:
#     enabled: false
#   # go2rtc viewer the intercom page embeds for each node (a plain go2rtc
#   # viewer: the page never talks to go2rtc). The page hears that node through
#   # the viewer, and the rest of the call through gocalis. Must be reachable
#   # from the browser over HTTPS when the page is served over HTTPS.
#   viewers:
#     front_door: "https://go2rtc.example/stream.html?src=doorbell_tv&mode=webrtc"

# Plugins: optional parts of gocalis, switched on here. Each has an id (how API
# requests address it), a type (the plugin code) and settings of its own.
# plugins:
#   # telegram_call: brings a Telegram group's voice chat into an intercom call
#   # with a node. On the "call" command it opens the group's voice chat and
#   # waits there; the intercom call starts when somebody from the group comes
#   # in. It logs in as a Telegram user (a bot cannot be in a voice chat): use
#   # an account of its own, not the one you answer with, and log it in once
#   # with `gocalis -config config.yaml -plugin-setup telegram`.
#   - id: telegram
#     type: telegram_call
#     settings:
#       api_id: 123456                 # from https://my.telegram.org
#       api_hash: "0123456789abcdef0123456789abcdef"
#       phone: "+34600000000"          # the account; only the setup uses it
#       # The login. Whoever has this file has the account: keep it on a
#       # volume that outlives the container and out of backups you share.
#       session_file: "data/telegram.session"
#       chat: "Casa"                   # the group: @username, numeric id or exact title
#       title: "Timbre"                # name of a voice chat the plugin starts
#       ring_seconds: 60               # how long it waits for somebody to come in

mqtt:
  enabled: false
  broker: "tcp://localhost:1883"
  client_id: "gocalis"
  username: ""
  password: ""
  topic_prefix: "gocalis"
  qos: 1
  auto_reconnect: true

nodes:
  - node_id: "living_room"
    type: "local"
    audio:
      input_device_index: "Anker PowerConf S330"
      output_device_index: "Anker PowerConf S330"
      sample_rate: 16000
      gain: 1.5
    kws:
      enabled: true
      encoder: "./models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
      decoder: "./models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/decoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
      joiner: "./models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
      tokens: "./models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/tokens.txt"
      keywords_file: "./models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/keywords.txt"
      threshold: 0.25
      auto_ask: true
      auto_ask_capture_delay_seconds: 1.5
      # Keep the wake word armed while this node is in an intercom call: saying
      # it sets the node aside from the call while the assistant listens, and
      # the "wake" event carries in_call. Only for nodes whose microphone does
      # not pick up their own speaker (hardware echo cancellation); otherwise
      # anyone in the call can wake the assistant through that speaker.
      # wake_in_call: true
      priority: 10
      wake_responses: []
      num_threads: 1

  - node_id: "front_door"
    type: "rtc_stream"
    rtc_stream:
      api_url: "http://192.168.50.5:1984"
      stream_name: "doorbell"
      output_gain_db: 6.0
      # Route outbound TTS to the Aqara G4 HomeKit backchannel via go2rtc:
      # gocalis pushes Opus over a WebRTC WHIP producer into talkback_in_stream,
      # then go2rtc transcodes it to AAC-ELD into talkback_stream. Inbound
      # doorbell mic audio (wake/ASR) keeps flowing over the receive WebRTC
      # connection to stream_name.
      talkback_stream: "doorbell_raw_homekit"
      talkback_in_stream: "talkback_in"
      # Set true only if the device/transport performs acoustic echo cancellation.
      # When false (default), the brain runs a half-duplex gate: the mic capture
      # path is muted while the node is SPEAKING to prevent self-barge-in.
      echo_cancellation: false
    kws:
      enabled: true
      encoder: "./models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
      decoder: "./models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/decoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
      joiner: "./models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
      tokens: "./models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/tokens.txt"
      keywords_file: "./models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/keywords.txt"
      threshold: 0.25
      auto_ask: true
      auto_ask_capture_delay_seconds: 1.5
      priority: 10
      wake_responses: 
        - "¿Qué desea?"
        - "¿Cómo puedo ayudar?"
        - "Sí, mi señor"
      num_threads: 1
