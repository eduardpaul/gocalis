# Supply fixtures in tools/simulator/fixtures. CLI replay paths are relative to
# this file; the browser/HTTP version uses paths relative to the fixtures mount.
name: prompt-reply
requires: [../fixtures/question.wav]
sequences:
  kitchen:
    - action: command
      timeout: 5s
      command: {action: ask, text: 'What can I help with?', vad_timeout_seconds: 8, capture_delay_seconds: 0, post_speech_silence_seconds: 0.5}
    - {action: wait_activity, direction: output, timeout: 10s}
    - {action: replay, replay: ../fixtures/question.wav}
    - {action: wait_event, event: ask_completed, contains: 'hello', timeout: 20s}
    - {action: assert_output, min_active_seconds: 0.2, max_seconds: 30}
