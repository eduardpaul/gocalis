# This virtual transport has no acoustic echo. Use echo_cancellation: true.
name: barge-in
requires: [../fixtures/question.wav]
sequences:
  kitchen:
    - action: command
      timeout: 5s
      command: {action: ask, barge_in: true, text: 'This is a long prompt. Please interrupt it with your question while it is still playing. The simulator will capture your speech.', vad_timeout_seconds: 8, capture_delay_seconds: 0, post_speech_silence_seconds: 0.5}
    - {action: wait_activity, timeout: 10s}
    - {action: replay, replay: ../fixtures/question.wav}
    - {action: wait_event, event: ask_completed, contains: 'hello', timeout: 20s}
    - {action: assert_output, min_active_seconds: 0.1, max_seconds: 30}
