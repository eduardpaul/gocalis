<script type="text/javascript">
    RED.nodes.registerType('gocalis-ask',{
        category: 'Gocalis Voice',
        color: '#a78bfa',
        defaults: {
            name: { value: "" },
            server: { value: "", type: "gocalis-config", required: true },
            nodeId: { value: "default" },
            nodeIdType: { value: "str" },
            promptText: { value: "" },
            promptTextType: { value: "str" },
            bargeIn: { value: true },
            requireSpeakerId: { value: false },
            outputFormat: { value: "both" },
            vadTimeout: { value: 10.0, validate: RED.validators.number() },
            captureDelay: { value: "", validate: function(v) { return v === "" || !isNaN(parseFloat(v)); } },
            priority: { value: 0, validate: RED.validators.number() },
            callMode: { value: "" }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["Success", "Timeout / Auth Failed"],
        icon: "font-awesome/fa-microphone",
        label: function() {
            return this.name || this.promptText || "Gocalis Ask";
        },
        paletteLabel: "gocalis ask",
        oneditprepare: function() {
            $("#node-input-promptText").typedInput({
                default: 'str',
                typeField: $("#node-input-promptTextType"),
                types: ['str', 'msg', 'flow', 'global', 'env', 'jsonata']
            });
            $("#node-input-nodeId").typedInput({
                default: 'str',
                typeField: $("#node-input-nodeIdType"),
                types: ['str', 'msg', 'flow', 'global', 'env', 'jsonata']
            });
        }
    });
</script>

<script type="text/html" data-template-name="gocalis-ask">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-server"></i> Server</label>
        <input type="text" id="node-input-server">
    </div>
    <div class="form-row">
        <label for="node-input-nodeId"><i class="fa fa-server"></i> Node ID</label>
        <input type="text" id="node-input-nodeId" placeholder="Physical node ID (default: 'default')" style="width: 70%;">
        <input type="hidden" id="node-input-nodeIdType">
    </div>
    <div class="form-row">
        <label for="node-input-promptText"><i class="fa fa-comment"></i> Prompt Text</label>
        <input type="text" id="node-input-promptText" placeholder="Text to say before listening" style="width: 70%;">
        <input type="hidden" id="node-input-promptTextType">
    </div>
    <div class="form-row">
        <label for="node-input-bargeIn"><i class="fa fa-hand-paper-o"></i> Barge-In</label>
        <input type="checkbox" id="node-input-bargeIn" style="display: inline-block; width: auto; vertical-align: top;">
        <span>Allow user to interrupt speech playback</span>
    </div>
    <div class="form-row">
        <label for="node-input-requireSpeakerId"><i class="fa fa-user-secret"></i> Verify Speaker</label>
        <input type="checkbox" id="node-input-requireSpeakerId" style="display: inline-block; width: auto; vertical-align: top;">
        <span>Require biometric speaker identification</span>
    </div>
    <div class="form-row">
        <label for="node-input-outputFormat"><i class="fa fa-file-audio-o"></i> Output Format</label>
        <select id="node-input-outputFormat">
            <option value="text">Text (Transcription Only)</option>
            <option value="audio">Audio (WAV Base64 Only)</option>
            <option value="both">Both (Text + Audio)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-vadTimeout"><i class="fa fa-clock-o"></i> VAD Timeout</label>
        <input type="number" id="node-input-vadTimeout" placeholder="10.0" step="0.5" min="1">
    </div>
    <div class="form-row">
        <label for="node-input-captureDelay"><i class="fa fa-hourglass-start"></i> Capture Delay</label>
        <input type="number" id="node-input-captureDelay" placeholder="node default (auto_ask_capture_delay_seconds)" step="0.1" min="0">
    </div>
    <div class="form-row">
        <label for="node-input-priority"><i class="fa fa-sort-amount-desc"></i> Priority</label>
        <input type="number" id="node-input-priority" placeholder="0" min="0" step="1">
    </div>
    <div class="form-row">
        <label for="node-input-callMode"><i class="fa fa-phone"></i> In a call</label>
        <select id="node-input-callMode" style="width: 70%;">
            <option value="">Fail (the call owns the node)</option>
            <option value="node">Ask the node, set aside from the call</option>
        </select>
    </div>
</script>

<script type="text/html" data-help-name="gocalis-ask">
    <h3>During an intercom call</h3>
    <p>By default an ask fails for a node in an intercom call
    (<code>"node is in an intercom call"</code>). <b>In a call</b> (or
    <code>msg.call_mode = "node"</code>) runs it inside the call: the node is set
    aside from the conversation while it hears the prompt and answers, so the
    others hear neither, and is put back as soon as it has been listened to.
    There is no barge-in or voice challenge in a call. The result carries
    <code>msg.in_call</code>.</p>
</script>
