services:
  app:
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models
    # Host networking also carries WebRTC's negotiated UDP media ports.
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    stop_grace_period: 60s

  test:
    profiles: [test]
    build:
      context: .
      target: test
